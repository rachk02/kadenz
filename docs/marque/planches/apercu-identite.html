<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Identité Kadenz</title>
<style>
@font-face{font-family:Inter;src:url(polices/Inter.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:"Space Grotesk";src:url(polices/SpaceGrotesk.ttf) format("truetype");font-weight:300 700}
*{box-sizing:border-box;margin:0;font-style:normal}
body{background:#F4F5F9;color:#1F2933;font-family:Inter,sans-serif;width:2400px;padding:88px 72px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:56px}
header img{height:72px;display:block}
h1{font-family:"Space Grotesk";font-weight:700;font-size:56px;letter-spacing:-.01em}
.sous{color:#52606D;font-size:22px;text-align:right;margin-top:8px}
.grille{display:grid;grid-template-columns:repeat(3,720px);justify-content:space-between;row-gap:48px}
figure img{display:block;border-radius:4px;border:1px solid #D9DCE3;background:#fff}
figcaption{font-family:"Space Grotesk";font-weight:700;font-size:24px;margin-top:16px}
figcaption span{color:#2D3A8C;margin-right:14px}
</style></head><body>
<header><img src="../kadenz-logo-horizontal.svg" alt="Kadenz">
<div><h1>Identité « Quatre pièces »</h1><p class="sous">Aperçu complet des neuf planches</p></div></header>
<div class="grille"><figure><img src="images/01-primary-logo.png" width="720" height="456" alt="Logo principal"><figcaption><span>01</span>Logo principal</figcaption></figure><figure><img src="images/02-logomark.png" width="720" height="456" alt="Symbole"><figcaption><span>02</span>Symbole</figcaption></figure><figure><img src="images/03-tone-mood.png" width="720" height="456" alt="Ton"><figcaption><span>03</span>Ton</figcaption></figure><figure><img src="images/04-color-system.png" width="720" height="456" alt="Couleurs"><figcaption><span>04</span>Couleurs</figcaption></figure><figure><img src="images/05-brand-pattern.png" width="720" height="456" alt="Motifs"><figcaption><span>05</span>Motifs</figcaption></figure><figure><img src="images/06-typography.png" width="720" height="456" alt="Typographie"><figcaption><span>06</span>Typographie</figcaption></figure><figure><img src="images/07-signage.png" width="720" height="456" alt="Signalétique"><figcaption><span>07</span>Signalétique</figcaption></figure><figure><img src="images/08-stationery.png" width="720" height="456" alt="Papeterie"><figcaption><span>08</span>Papeterie</figcaption></figure><figure><img src="images/09-brand-mockups.png" width="720" height="456" alt="Mises en situation"><figcaption><span>09</span>Mises en situation</figcaption></figure></div>
</body></html>
