[workspace]
resolver = "3"
members = [
    "crates/domaine",
    "crates/stockage",
    "crates/import",
    "crates/pdf",
    "crates/licence",
    "crates/editeur",
    "crates/export",
    "crates/maj",
    "crates/protocole",
    "crates/client",
    "crates/poste",
    "crates/serveur",
    "crates/relais",
    "crates/portail",
    "crates/app",
    "crates/admin",
]
# Copies de crates tiers modifiées : hors des vérifications de l'espace de travail.
exclude = ["vendor"]

# Chiffrement de la base (cahier, section 13) : libsqlite3-sys compile
# l'amalgamation de SQLite3 Multiple Ciphers au lieu de celle de SQLite.
[patch.crates-io]
libsqlite3-sys = { path = "vendor/libsqlite3-sys" }

[workspace.package]
version = "0.3.6"
edition = "2024"
publish = false

[workspace.dependencies]
kadenz-domaine = { path = "crates/domaine" }
kadenz-stockage = { path = "crates/stockage" }
kadenz-import = { path = "crates/import" }
kadenz-pdf = { path = "crates/pdf" }
kadenz-licence = { path = "crates/licence" }
kadenz-export = { path = "crates/export" }
kadenz-maj = { path = "crates/maj" }
kadenz-protocole = { path = "crates/protocole" }
kadenz-client = { path = "crates/client" }
kadenz-poste = { path = "crates/poste" }
kadenz-serveur = { path = "crates/serveur" }
kadenz-relais = { path = "crates/relais" }
kadenz-portail = { path = "crates/portail" }
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
slint = { version = "1.18.1", features = ["raw-window-handle-06"] }
slint-build = "1.18.1"
rfd = { version = "0.18.0", default-features = false }
csv = "1.4.0"
calamine = "0.38.0"
quick-xml = "0.42.0"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }
encoding_rs = "0.8.44"
argon2 = "0.6.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
serde_json = "1.0.154"
winresource = "0.1.34"
krilla = "0.8.2"
# Même version que celle de krilla : façonnage identique pour la mesure et le tracé.
rustybuzz = "0.20.1"
# Rendu des PDF en image pour l'aperçu des réglages d'impression (J8b) ; nos PDF
# embarquent leurs polices.
hayro = { version = "0.9.0", default-features = false }
# Licence (J9) : signature Ed25519 des clés, empreinte du poste, encodage.
ed25519-dalek = "2.2.0"
sha2 = "0.10.9"
base64 = "0.22.1"
getrandom = "0.3.4"
windows-sys = "0.61.2"
# Coller depuis Word : image de la sélection copiée, encodée en PNG.
png = "0.18.1"
# Aperçu et impression (A2) : poignée de la fenêtre de Kadenz, propriétaire de la
# fenêtre d'impression ; même version que celle de slint et rfd.
raw-window-handle = "0.6.2"
# Export Excel (J10) : écriture des classeurs xlsx, dates chrono natives.
rust_xlsxwriter = { version = "0.102.0", features = ["chrono"] }
# Mises à jour (J10) : requête HTTPS vers les releases GitHub, TLS du système
# (schannel) et ses certificats racines.
# Phase 2 (F1) : format des échanges entre postes et serveur, identifiants
# globaux (UUID version 7).
serde = { version = "1.0.229", features = ["derive"] }
uuid = { version = "1.29.2", features = ["v7"] }
# Phase 2 (F2) : TLS 1.3 entre postes et serveur, fournisseur ring (se compile
# avec MSVC, sans CMake ni NASM), certificats auto-signés, service Windows.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
# Phase 2 (F8) : vérification par le relais de la signature d'un défi avec la
# clé d'un certificat (déjà tirée par rustls).
rustls-webpki = { version = "0.103.16", default-features = false, features = ["ring", "std"] }
windows-service = "0.8.1"
ureq = { version = "3.5.1", default-features = false, features = ["native-tls-no-default"] }
# Phase 2 (relais par Cloudflare Tunnel, docs/spec-relais-websocket.md) :
# WebSocket sur tokio, TLS vers Cloudflare par rustls avec le fournisseur ring
# et les racines du magasin du système ; aucune fonction par défaut, pour ne
# pas tirer aws-lc.
tokio = { version = "1.54.1", default-features = false }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
rustls-native-certs = "0.8.5"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }

# Argon2 non optimisé met plusieurs secondes par hachage : on optimise les
# dépendances même en mode debug pour que connexion et tests restent rapides.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true
