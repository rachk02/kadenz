[workspace]
resolver = "3"
members = ["crates/domaine", "crates/stockage", "crates/import", "crates/pdf", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
kadenz-domaine = { path = "crates/domaine" }
kadenz-stockage = { path = "crates/stockage" }
kadenz-import = { path = "crates/import" }
kadenz-pdf = { path = "crates/pdf" }
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
slint = { version = "1.18.1", features = ["raw-window-handle-06"] }
slint-build = "1.18.1"
rfd = { version = "0.18.0", default-features = false }
csv = "1.4.0"
calamine = "0.38.0"
encoding_rs = "0.8.44"
argon2 = "0.6.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
serde_json = "1.0.154"
winresource = "0.1.34"
krilla = "0.8.2"
# Même version que celle de krilla : façonnage identique pour la mesure et le tracé.
rustybuzz = "0.20.1"
# Rendu des PDF en image pour l'aperçu des réglages d'impression (J8b) ; nos PDF
# embarquent leurs polices.
hayro = { version = "0.9.0", default-features = false }

# Argon2 non optimisé met plusieurs secondes par hachage : on optimise les
# dépendances même en mode debug pour que connexion et tests restent rapides.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true
