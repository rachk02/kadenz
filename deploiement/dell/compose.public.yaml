# Ouverture de la console des licences vers Internet par Cloudflare Tunnel.
# Surcouche, sur accord de l'utilisateur seulement. Jamais appelée à la main :
# KADENZ_PUBLIC=1 dans /etc/kadenz/kadenz.env, et kadenz-compose l'ajoute à
# chaque appel (kadenz-compose up -d portail tunnel).
#
# Procédure : docs/deploiement-vps.md, section 7, « Cloudflare Tunnel ».
#
# cloudflared ne fait que sortir vers Cloudflare : aucun port publié, rien ne
# touche le réseau de l'hôte (Tailscale, ufw, sshd). Le nom public et sa route
# vers http://portail:47382 sont réglés dans le compte Cloudflare de
# l'utilisateur (tunnel géré à distance) ; aucun nom ni jeton ici.
#
# Le relais y passe en WebSocket (docs/spec-relais-websocket.md) : sa
# passerelle écoute en HTTP simple sur le réseau interne « tunnel-relais »,
# et la route relais.mcarre.dev vers http://relais:47383 est réglée dans le
# compte Cloudflare. Le flux du relais, TLS épinglé compris, passe tel quel
# dans la WebSocket. Exige une image du relais qui connaît --ecoute-ws
# (commit 453c3f5 ou plus récent) : une image plus ancienne refuserait
# l'option et le relais ne démarrerait pas.

services:
  portail:
    # --mandataire : l'adresse fixe de cloudflared sur le réseau « console » ;
    # l'adresse du client est lue dans CF-Connecting-IP (vérifié par OpenCode
    # dans la documentation de Cloudflare), pour ses requêtes seulement.
    # La publication sur 127.0.0.1 reste (administration par ssh -L) : ces
    # connexions viennent de la passerelle du réseau « portail », qui n'est
    # pas le mandataire, et gardent l'adresse du pair.
    command:
      - --cle
      - /run/secrets/cle_portail
      - --mandataire
      - ${IP_TUNNEL:?IP_TUNNEL manquant}
      - --entete-client
      - cf-connecting-ip
      # Aperçu des liens partagés de la page de connexion (Open Graph) ;
      # le portail reste en noindex.
      - --adresse-publique
      - ${ADRESSE_PUBLIQUE:?ADRESSE_PUBLIQUE manquant}
      # Téléchargements et mises à jour servis par le portail (décision 77).
      - --depot
      - /depot
    networks:
      portail: {}
      console: {}

  relais:
    # Le point d'entrée de l'image donne déjà --dossier et --ecoute 0.0.0.0:47381
    # (crates/relais/Dockerfile) ; ces options s'y ajoutent. --mandataire :
    # l'adresse fixe de cloudflared sur « tunnel-relais » ; CF-Connecting-IP
    # n'est cru que sur les requêtes d'ouverture venues de lui.
    command:
      - --ecoute-ws
      - 0.0.0.0:47383
      - --mandataire
      - ${IP_TUNNEL_RELAIS:?IP_TUNNEL_RELAIS manquant}
      # Secret posé par Cloudflare (docs/spec-relais-websocket.md, section 9) :
      # règle de transformation « Kadenz relais secret » du compte Cloudflare,
      # activée le 2026-11-25. Sans la règle, toute session distante est refusée.
      - --secret-ws
      - /run/secrets/secret-ws
    volumes:
      - ${SECRET_WS_HOTE:?SECRET_WS_HOTE manquant}:/run/secrets/secret-ws:ro
    networks:
      relais: {}
      tunnel-relais: {}
    # La sonde de base ne teste que le TCP 47381. Ici, vérifier aussi que la
    # passerelle 47383 accepte encore les WebSocket, sinon le tunnel reste
    # « healthy » alors que les postes distants ne peuvent plus se connecter.
    healthcheck:
      test: ["CMD", "/usr/local/bin/kadenz-relais", "sante", "--dossier", "/donnees", "--ws", "127.0.0.1:47383"]

  tunnel:
    # Image officielle épinglée par empreinte (kadenz.env.exemple), utilisateur
    # 65532:65532, point d'entrée cloudflared (relevés sur le Dell).
    image: ${IMAGE_CLOUDFLARED:?IMAGE_CLOUDFLARED manquant}
    restart: unless-stopped
    init: true
    entrypoint: ["cloudflared"]
    # Tunnel géré à distance : la route vers le portail est dans le compte
    # Cloudflare. Métriques en local au conteneur seulement.
    # Transport en HTTP/2 (TCP) et non en QUIC (UDP) : les coupures des 23 et 24
    # novembre 2026 étaient des délais dépassés de QUIC ; HTTP/2 passe partout où
    # le TCP 443 sort.
    command:
      - tunnel
      - --no-autoupdate
      - --protocol
      - http2
      - --metrics
      - 127.0.0.1:20241
      - run
      - --token-file
      - /run/secrets/jeton_tunnel
    volumes:
      # Jeton du tunnel : fichier de l'hôte, hors dépôt et hors sauvegardes,
      # propriétaire 65532 (utilisateur de l'image), mode 400.
      - type: bind
        source: ${JETON_TUNNEL:?JETON_TUNNEL manquant}
        target: /run/secrets/jeton_tunnel
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Pas de sonde : l'image n'a ni shell ni curl, et aucune commande de santé
    # n'est encore vérifiée dans la documentation. kadenz-sante surveille
    # l'état du conteneur.
    networks:
      console:
        ipv4_address: ${IP_TUNNEL:?IP_TUNNEL manquant}
      tunnel-relais:
        ipv4_address: ${IP_TUNNEL_RELAIS:?IP_TUNNEL_RELAIS manquant}
      # Sortie vers Cloudflare : les réseaux internes n'en ont pas.
      sortie: {}

networks:
  # Interne : seuls le portail et cloudflared s'y trouvent.
  console:
    internal: true
    ipam:
      config:
        - subnet: ${RESEAU_CONSOLE:?RESEAU_CONSOLE manquant}
  # Interne : seuls le relais et cloudflared s'y trouvent ; distinct de
  # « console », pour que le portail et le relais ne se voient pas.
  tunnel-relais:
    internal: true
    ipam:
      config:
        - subnet: ${RESEAU_TUNNEL_RELAIS:?RESEAU_TUNNEL_RELAIS manquant}
  sortie: {}
