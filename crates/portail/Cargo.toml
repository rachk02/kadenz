[package]
name = "kadenz-portail"
description = "Portail des licences de Kadenz (phase 2, jalon F9) : comptes éditeur et revendeur, paiements enregistrés, émission des licences d'abonnement, journal des actions."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
kadenz-licence.workspace = true
kadenz-domaine.workspace = true
rusqlite.workspace = true
argon2.workspace = true
chrono.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
sha2.workspace = true
serde_json.workspace = true
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "form"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync"] }
maud = "0.27.0"
# Effacement de la clé et du mot de passe lus (déjà dans l'arbre, par ed25519-dalek).
zeroize = "1.9.1"
# Saisie sans écho du mot de passe de `creer-editeur`.
rpassword = "=7.5.4"
# Double authentification (TOTP, RFC 6238, module `totp`) : HMAC-SHA-1 sur
# digest 0.10, déjà dans l'arbre par sha2 ; Base32 et comparaison en temps
# constant, déjà dans l'arbre.
hmac = "0.12.1"
sha1 = "0.10.7"
data-encoding = "2.11.1"
subtle = "2.6.1"

[dev-dependencies]
kadenz-stockage.workspace = true
kadenz-maj.workspace = true
